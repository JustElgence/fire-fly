# memos.teardrop.cn 反向代理配置片段
# 放到宿主机 Nginx：/etc/nginx/conf.d/memos.teardrop.cn.conf（或 sites-available + 软链）
#
# 首次配置证书：
#   先把本文件中两个 ssl_certificate 行注释掉、listen 443 ssl http2; 改为 listen 80;
#   nginx -s reload 后执行：
#     certbot --nginx -d memos.teardrop.cn
#   certbot 会自动改写证书与 80 跳转 443，之后再核对一遍本文件的 CORS 部分。

server {
    listen 443 ssl http2;
    server_name memos.teardrop.cn;

    # 证书路径按 certbot 实际输出调整
    ssl_certificate     /etc/letsencrypt/live/memos.teardrop.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memos.teardrop.cn/privkey.pem;

    # ---- CORS：仅允许博客站点读取 API（浏览器端实时拉取动态必需） ----
    set $cors_origin "";
    if ($http_origin ~* ^https://(blog\.teardrop\.cn|teardrop\.cn)$) {
        set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type" always;
    add_header Access-Control-Max-Age       "86400" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }
    # ----------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:5230;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128m;   # 允许上传较大的图片附件
    }
}

server {
    listen 80;
    server_name memos.teardrop.cn;
    return 301 https://$host$request_uri;
}
